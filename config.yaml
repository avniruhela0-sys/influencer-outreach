# ---- Campaign: who is reaching out and what they offer (EDIT THIS) ----
campaign:
  brand_name: "GlowLab"
  brand_description: "a skincare brand making simple, dermatologist-tested products"
  collaboration_type: "UGC content creation"
  offer: "free product kit plus a paid UGC fee"
  sender_name: "Avni Ruhela"
  sender_role: "Partnerships, GlowLab"
# ---- Discovery ----
discovery:
  category: fashion_beauty
  search_modes: [channel, video]      # channel search + recent-video search (video search surfaces smaller creators)
  region_codes: ["US"]
  pages_per_query: 2                  # 50 results/page, 100 quota units per page
  video_search_days: 90
  max_candidates: 300
  recent_videos_sampled: 10

# ---- Filtering ----

filters:
  min_followers: 5000
  max_followers: 100000
  min_engagement_rate: 1.5
  max_days_since_last_upload: 90
  min_recent_videos: 5
  min_keyword_matches: 2
  allowed_countries: []
  require_known_country: false      # if true, channels with no country set fail

categories:
  fashion_beauty:
    discovery_keywords:
      - skincare routine
      - makeup tutorial
      - get ready with me
      - fashion haul
      - outfit ideas
      - beauty review
      - hair care routine
      - style lookbook
    keywords:
      - skincare
      - makeup
      - beauty
      - fashion
      - outfit
      - style
      - haircare
      - hair care
      - lookbook
      - grwm
      - get ready with me
      - haul
      - cosmetics
      - foundation
      - lipstick
      - serum
      - moisturizer
      - thrift
      - wardrobe
      - ootd
    blocklist:        # brand-safety: any hit in channel title/description/recent video titles fails
      - gambling
      - casino
      - betting
      - adult
      - 18+
      - nsfw
      - forex signals
      - get rich quick

sending:
  max_emails_per_run: 25
  delay_seconds: 20
